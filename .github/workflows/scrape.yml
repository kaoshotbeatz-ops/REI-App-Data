name: Sync events from racialequityinstitute.org
on:
  schedule:
    - cron: "17 9 * * *"   # daily
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize trainings page into events.json
        id: normalize
        continue-on-error: true
        run: node scripts/normalize.mjs
      - name: Open issue on parse failure
        if: steps.normalize.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Event scrape failed $(date -u +%F)" \
            --body "scripts/normalize.mjs could not parse https://www.racialequityinstitute.org/trainings?format=json — the existing events.json was kept. Check whether the page structure changed." \
            || true
      - name: Commit if changed
        if: steps.normalize.outcome == 'success'
        run: |
          if ! git diff --quiet; then
            git config user.name "rei-data-bot"
            git config user.email "actions@github.com"
            git add events.json manifest.json
            git commit -m "Sync events from racialequityinstitute.org"
            git push
          fi
